services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: panda
      POSTGRES_PASSWORD: panda
      POSTGRES_DB: panda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U panda -d panda" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        REQUIREMENTS: dev
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://panda:panda@db:5432/panda
    user: "${UID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
